<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game of Chaos · 元胞自动机沙盒</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <svg class="logo" viewBox="0 0 5 5" aria-hidden="true">
            <rect x="1" y="0" width="1" height="1" />
            <rect x="2" y="1" width="1" height="1" />
            <rect x="0" y="2" width="1" height="1" />
            <rect x="1" y="2" width="1" height="1" />
            <rect x="2" y="2" width="1" height="1" />
          </svg>
          <div>
            <h1>Game of Chaos</h1>
            <p class="tagline">元胞自动机沙盒 · Conway's Game of Life</p>
          </div>
        </div>

        <div class="rule-bar">
          <label class="field">
            <span>规则</span>
            <input id="rule-input" class="mono" type="text" value="B3/S23" spellcheck="false" autocomplete="off" />
          </label>
          <select id="rule-preset" class="mono">
            <option value="">预设规则…</option>
          </select>
          <button id="rule-apply" class="btn">应用</button>
          <span id="rule-error" class="rule-error"></span>
        </div>
      </header>

      <main>
        <section class="stage" id="stage">
          <canvas id="board"></canvas>
          <div class="stage-hint">
            左键绘制 · 右键擦除 · 空格播放/暂停 · 单步 <kbd>.</kbd>
          </div>
        </section>

        <aside class="panel">
          <div class="transport">
            <button id="btn-play" class="btn primary">▶ 播放</button>
            <button id="btn-step" class="btn">单步</button>
            <button id="btn-clear" class="btn">清空</button>
            <button id="btn-random" class="btn">随机</button>
          </div>

          <section class="block">
            <h2>状态</h2>
            <dl class="stats">
              <div><dt>世代</dt><dd id="stat-gen" class="mono">0</dd></div>
              <div><dt>存活</dt><dd id="stat-pop" class="mono">0</dd></div>
              <div><dt>出生</dt><dd id="stat-born" class="mono">0</dd></div>
              <div><dt>死亡</dt><dd id="stat-died" class="mono">0</dd></div>
            </dl>
            <canvas id="spark" class="spark"></canvas>
          </section>

          <section class="block">
            <h2>参数</h2>
            <div class="row">
              <span class="slabel">速度</span>
              <input id="speed" type="range" min="1" max="60" value="10" />
              <span id="speed-val" class="value mono">10 代/秒</span>
            </div>
            <div class="row">
              <span class="slabel">密度</span>
              <input id="density" type="range" min="5" max="80" value="30" />
              <span id="density-val" class="value mono">30%</span>
            </div>
          </section>

          <section class="block">
            <h2>视图</h2>
            <label class="check"><input id="opt-wrap" type="checkbox" checked /> 边界环绕（环面）</label>
            <label class="check"><input id="opt-grid" type="checkbox" checked /> 显示网格</label>
            <label class="check"><input id="opt-age" type="checkbox" checked /> 按存活时长着色</label>
            <div class="row">
              <select id="board-size">
                <option value="120x80">120 × 80</option>
                <option value="160x100" selected>160 × 100</option>
                <option value="240x150">240 × 150</option>
                <option value="320x200">320 × 200</option>
              </select>
              <span class="value mono">格子尺寸</span>
            </div>
          </section>

          <section class="block">
            <h2>图样</h2>
            <div id="patterns" class="patterns"></div>
            <p class="hint">选中后点击画布放置，<kbd>R</kbd> 旋转，<kbd>Esc</kbd> 取消。</p>
          </section>
        </aside>
      </main>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
